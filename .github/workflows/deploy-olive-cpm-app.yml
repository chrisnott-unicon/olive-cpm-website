name: Deploy Olive CPM app to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - '.github/workflows/deploy-olive-cpm-app.yml'
  workflow_dispatch: {}

env:
  GCP_REGION: europe-west1
  SERVICE_NAME: olive-cpm-app
  ARTIFACT_REPO: olive-cpm

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation — no long-lived key needed
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        working-directory: webapp
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE }}
          # Distinct from the deployer identity above — this is what
          # server.ts's Firebase Admin SDK runs as via Application Default
          # Credentials. See DEPLOY.md for the IAM roles it needs.
          service_account: olive-cpm-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          secrets: |
            GEMINI_API_KEY=GEMINI_API_KEY:latest
