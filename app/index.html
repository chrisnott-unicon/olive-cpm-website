<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Sign In | Olive CPM</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        unicon: { black: '#0a0a0a', dark: '#1c1c1c', slate: '#f4f4f5', green: '#475c4d', border: '#e5e7eb' },
                        olive: { primary: '#475c4d', dark: '#2c3b31' }
                    },
                    fontFamily: { sans: ['"Century Gothic"', 'sans-serif'], mono: ['ui-monospace', 'monospace'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #ffffff; color: #0a0a0a; margin: 0; }
        .bg-blueprint { background-image: linear-gradient(to right, rgba(229, 231, 235, 0.6) 1px, transparent 1px), linear-gradient(to bottom, rgba(229, 231, 235, 0.6) 1px, transparent 1px); background-size: 4rem 4rem; }
    </style>
</head>
<body class="font-sans min-h-screen flex items-center justify-center bg-blueprint px-6">

    <div class="w-full max-w-sm bg-white border border-unicon-border shadow-xl p-8 sm:p-10 rounded-sm">

        <div class="flex items-center gap-3 mb-8">
            <div class="w-9 h-9 bg-unicon-green text-white flex items-center justify-center font-black text-xl rounded-sm">O</div>
            <span class="font-extrabold text-xl tracking-tighter uppercase text-unicon-black">Olive <span class="text-unicon-green">CPM</span></span>
        </div>

        <p class="text-[10px] font-mono text-gray-500 uppercase tracking-widest mb-1 font-bold">Status</p>
        <p class="text-sm text-gray-700 mb-6">
            The application backend has not been provisioned yet. This page is a
            placeholder for tenant sign-in — see
            <code class="text-xs bg-unicon-slate px-1">/firebase/README.md</code>
            in the repo for setup steps.
        </p>

        <button id="google-signin" disabled
            class="w-full py-3 border border-unicon-border text-sm font-bold uppercase tracking-widest text-gray-400 flex items-center justify-center gap-3 rounded-sm cursor-not-allowed">
            <i class="fa-brands fa-google"></i> Sign in with Google
        </button>

        <p class="text-[10px] text-gray-400 mt-6 text-center uppercase tracking-widest font-mono">
            Enterprise access is tenant-scoped and invitation-only
        </p>
    </div>

    <script type="module">
        import { loadFirebase, FIREBASE_CONFIG } from './js/firebase-init.js';

        const signInBtn = document.getElementById('google-signin');

        if (FIREBASE_CONFIG.apiKey !== 'REPLACE_ME') {
            const { app, auth } = await loadFirebase();
            const authClient = auth.getAuth(app);
            const provider = new auth.GoogleAuthProvider();

            signInBtn.disabled = false;
            signInBtn.classList.remove('text-gray-400', 'cursor-not-allowed');
            signInBtn.classList.add('text-unicon-black', 'hover:border-unicon-green', 'hover:text-unicon-green');

            signInBtn.addEventListener('click', async () => {
                try {
                    const result = await auth.signInWithPopup(authClient, provider);
                    const token = await result.user.getIdTokenResult();
                    if (!token.claims.tenantId) {
                        alert('Signed in, but no tenant is assigned to this account yet. Contact your Olive CPM administrator.');
                        return;
                    }
                    window.location.href = './dashboard.html';
                } catch (err) {
                    console.error(err);
                    alert('Sign-in failed: ' + err.message);
                }
            });
        }
    </script>
</body>
</html>
